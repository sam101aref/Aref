name: Release Build

# Builds a signed Android App Bundle (.aab) for Google Play when a version tag (v1.0.0) is pushed,
# or on demand. One-time setup: the Unity secrets used by android.yml plus the upload key:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS
# (see docs/RELEASE.md).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check secrets
        if: env.UNITY_EMAIL == '' || (env.UNITY_LICENSE == '' && env.UNITY_SERIAL == '') || env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Missing Unity license or Android upload key secrets (docs/RELEASE.md)."
          exit 1

      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Install Unity packages
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildName: ArashTheArcher
          buildMethod: Arash.Editor.Setup.CIBuild.InstallPackages
          versioning: None
          allowDirtyBuild: true

      - name: Build signed App Bundle
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          buildName: ArashTheArcher
          buildMethod: Arash.Editor.Setup.CIBuild.ConfigureAndBuild
          androidExportType: androidAppBundle
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          versioning: Tag
          allowDirtyBuild: true

      - uses: actions/upload-artifact@v4
        with:
          name: ArashTheArcher-aab
          path: build/Android/*.aab
          if-no-files-found: error

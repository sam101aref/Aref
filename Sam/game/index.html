<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2B1B12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sam Nariman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2B1B12; --paper: #F4E8CC; --gold: #C99A2E; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #2B1B12; } }
  :root[data-theme="dark"] { --ink: #2B1B12; }
  html, body { margin: 0; height: 100%; background: #140b06; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; font-family: Vazirmatn, Tahoma, sans-serif; }
  canvas { display: block; image-rendering: auto; }
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; }
  .tbtn { position: absolute; width: 56px; height: 56px; border-radius: 50%; pointer-events: auto;
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    background: rgba(244, 232, 204, 0.22); border: 2px solid rgba(201, 154, 46, 0.75); color: #F4E8CC;
    font: 700 15px Vazirmatn, Tahoma, sans-serif; text-shadow: 0 1px 2px #000; touch-action: none; }
  .tbtn.on { background: rgba(232, 198, 90, 0.55); }
</style>
</head>
<body>
<canvas id="game" aria-label="Sam Nariman game"></canvas>
<div id="touch"></div>
<script src="js/i18n.js"></script>
<script src="js/story.js"></script>
<script src="js/levels.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
